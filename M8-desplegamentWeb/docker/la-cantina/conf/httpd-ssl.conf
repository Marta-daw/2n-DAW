<VirtualHost *:443>
    DocumentRoot /usr/local/apache2/htdocs/info
    ServerName localhost
    
    # Activar SSL
    SSLEngine on
    SSLCertificateFile "/etc/apache2/ssl/cantina.cert"
    SSLCertificateKeyFile "/etc/apache2/ssl/cantina.key"

    # Logs
    TransferLog "logs/ssl_access_log"
    ErrorLog "logs/lacantina-ssl-error.log"
    CustomLog "logs/lacantina-ssl-access.log" combined
    
    # Directori principal
    <Directory "/usr/local/apache2/htdocs/info">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
