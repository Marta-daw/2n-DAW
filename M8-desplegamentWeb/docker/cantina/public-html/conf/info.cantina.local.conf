<VirtualHost *:80>
    ServerName info.cantina.local
    ServerAdmin admin@cantina.local
    
    DocumentRoot /usr/local/apache2/htdocs/info
    
    <Directory /usr/local/apache2/htdocs/info>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    
    # Logs específics per aquest VirtualHost
    ErrorLog /usr/local/apache2/logs/info.cantina.local-error.log
    CustomLog /usr/local/apache2/logs/info.cantina.local-access.log combined
</VirtualHost>
