<VirtualHost _default_:443>
    DocumentRoot "/usr/local/apache2/htdocs"
    ServerName localhost:443
    ServerAdmin admin@lacantina.local
    
    # Activar SSL
    SSLEngine on
    SSLCertificateFile "/usr/local/apache2/conf/server.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/server.key"
    SSLCertificateFile "/etc/apache2/ssl/lacantina.crt"
    SSLCertificateKeyFile "/etc/apache2/ssl/lacantina.key"

    # Logs
    ErrorLog "logs/ssl_error_log"
    TransferLog "logs/ssl_access_log"
    ErrorLog "logs/lacantina-ssl-error.log"
    CustomLog "logs/lacantina-ssl-access.log" combined
    
    # Directori principal
    <Directory "/usr/local/apache2/htdocs">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
